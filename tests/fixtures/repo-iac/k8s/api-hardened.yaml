# 正しく作った側。ここには ★ が付かないこと
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      hostPID: false
      hostIPC: false
      hostNetwork: false
      automountServiceAccountToken: false
      initContainers:
        - name: migrate
          image: example/api:1.0
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        - name: api
          image: example/api:1.0
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
          resources:
            requests:
              cpu: 100m
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: MODE
              value: production
        - name: sidecar
          image: example/sidecar:1.0
          resources:
            limits:
              memory: 64Mi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
  # name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: api
    namespace: default
