apiVersion: v1
kind: Pod
metadata:
  name: node-agent
spec:
  hostPID: true
  hostIPC: true
  # hostNetwork: true
  containers:
    - name: agent
      image: example/agent:1.0
      volumeMounts:
        - name: runtime-sock
          mountPath: /var/run/docker.sock
        - name: app-logs
          mountPath: /logs
  volumes:
    - name: runtime-sock
      hostPath:
        path: /var/run/docker.sock
    - name: app-logs
      hostPath:
        path: /var/log/app
---
apiVersion: v1
kind: Service
metadata:
  name: admin-panel
spec:
  type: NodePort
  ports:
    - port: 80
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deployer-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: everything
rules:
  - apiGroups: [""]
    resources: ["*"]
    verbs:
      - "*"
