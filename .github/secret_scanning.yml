# 検査の題材と検査のコードには、わざと鍵らしい形の架空の値（DUMMY・FIXTURE を含むもの）を置いている。
# 本物の鍵ではないので、secret scanning の対象から外す。外すのは架空の値を置いているファイルだけにし、
# tests/ のほかのファイルや skill/・README などは対象のまま。
# 以前は tests/fixtures/ 全体を外していて、題材に本物の鍵を写し込んでも GitHub の側で見つけられなかった。
# 架空の鍵らしい値を置いているディレクトリだけに絞る。題材を足して鍵らしい値を置くときは、ここに足す
paths-ignore:
  - "tests/fixtures/repo/**"
  - "tests/fixtures/repo-mobile/**"
  - "tests/fixtures/site/**"
  - "tests/run.sh"
