# 検査を push と pull request のたびに実行する。
# このスキルが評価対象に求める基準（references/10-dependencies.md の 3-3）を、自分にも当てる:
#   - Action はコミットハッシュで固定する（タグは差し替えられる）
#   - 権限は読み取りだけ。pull_request_target は使わない（他人のコードが秘密情報と同居する）
#   - checkout の認証情報をディスクに残さない。キャッシュは使わない（信頼できない入力で汚される）
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mutations:
        description: '検査の検査（mutations.sh）を、週 1 回の定期実行と同じ分担で実行する'
        type: boolean
        default: false
  schedule:
    - cron: '0 18 * * 0'   # 週 1 回、検査の検査（mutations.sh）まで実行する

permissions:
  contents: read

# 週 1 回の検査の検査と、push の検査が互いを打ち切らないよう、起動のきっかけごとに分ける
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS は評価者の標準の環境（bash 3.2、BSD の grep / sed）。Linux は GNU の道具と mawk
        os: [ubuntu-24.04, macos-15]
        # 週 1 回の検査の検査は、変異を 8 つに分けて並べる。変異ごとに run.sh 全体を実行するので、1 つの分担の時間は
        # 「変異の数 ÷ 分担の数 × run.sh 1 回」になる。2.25.0 の時点で macOS の run.sh は 1 回 4 分半ほどで、4 つに分けると
        # 1 つの分担が 5 時間を超え、上限（330 分）に近かった。手動の起動でも mutations を選べば同じ分担で実行する。
        # push などでは分担を作らない（0 は「自己監査を実行する」の意味）
        shard: ${{ fromJSON((github.event_name == 'schedule' || inputs.mutations) && '[1, 2, 3, 4, 5, 6, 7, 8]' || '[0]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.mutations) && 330 || 45 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Python の依存（openpyxl）
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r requirements-dev.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Linux の道具（dig・mawk・zip・rg）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends dnsutils mawk zip unzip ripgrep
          sudo update-alternatives --set awk /usr/bin/mawk
          # mawk で実行されていなければ止める（失敗を黙って続けると、gawk で通ったのを mawk で通ったと誤る）
          test "$(readlink -f "$(command -v awk)")" = /usr/bin/mawk

      - name: macOS の道具（rg）
        if: runner.os == 'macOS'
        # rg が無いと、rg と grep で同じ結果になるかの検査が省略され、README の件数と合わなくなる（2.23.0 の前から CI が失敗していた）
        run: brew install --quiet ripgrep

      - name: macOS では bash 3.2 と BSD の grep / sed / awk で実行する
        if: runner.os == 'macOS'
        run: |
          # ランナーには Homebrew の GNU の道具が入っていることがある。PATH の先頭に標準の道具を置く
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf /bin/bash "$RUNNER_TEMP/bin/bash"
          for t in grep sed awk; do ln -sf "/usr/bin/$t" "$RUNNER_TEMP/bin/$t"; done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Node の依存（ロックファイルどおり、インストール時のスクリプトは動かさない）
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Playwright のブラウザ
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium

      - name: 道具の版
        run: |
          bash --version | head -1
          # awk -W version は BSD の awk で標準入力を待つので使わない。実体の場所で見る
          for t in bash grep sed awk; do echo "$t -> $(command -v "$t") -> $(readlink -f "$(command -v "$t")" 2>/dev/null || true)"; done
          node --version
          # rg が無ければ止める（省略されたまま進むと、README の件数とのずれで初めて気づくことになる）
          rg --version | head -1
      - name: macOS の道具が BSD のものか確かめる
        if: runner.os == 'macOS'
        run: |
          test "$(bash -c 'echo ${BASH_VERSINFO[0]}')" = 3
          grep --version | grep BSD
          if sed --version >/dev/null 2>&1; then echo 'GNU の sed が使われている'; exit 1; fi   # 「! コマンド」は set -e で止まらない

      - name: 自己監査（検査を含む）
        if: matrix.shard == 0
        run: ./tests/self-audit.sh

      - name: 検査の検査（分担 ${{ matrix.shard }}/8）
        if: matrix.shard != 0
        run: |
          # 段は bash -e で動く。代入が 0 以外で終わった時点で止まると、出力を出さずに終わり、どの変異が生きていないかが
          # 分からない（分担にした最初の実行で起きた）。|| で終了コードを受ける
          st=0; out="$(./tests/mutations.sh --shard "${{ matrix.shard }}/8" 2>&1)" || st=$?
          printf '%s\n' "$out"
          # 生きていない検査が 1 件でもあれば失敗にする
          printf '%s\n' "$out" | sed 's/\x1b\[[0-9;]*m//g' | grep -E '生きていない 0( |$)' >/dev/null || exit 1
          exit $st
