# 依存の更新。題材（tests/fixtures）の依存の定義ファイルは .fixture を付けてあるので対象にならない。
# 公開直後の版は入れない（references/10-dependencies.md の 3-1 のクールダウン）。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # playwright の版は package.json・tests/docker/Dockerfile・browser_probe.mjs の 3 か所で揃えている。
      # 1 か所だけ上がると食い違うので、3 か所を一緒に手で上げる（tests/run.sh が一致を検査する）
      - dependency-name: playwright
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
